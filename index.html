<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazuuiie — bio</title>
<meta name="description" content="Trang bio cá nhân">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #fbe7cf;
    --bg-b: #f6d3c7;
    --paper-dim: #f9ecdd;
    --ink: #4a3336;
    --ink-soft: #8a6b62;
    --raspberry: #cf6478;
    --mustard: #e2a85c;
    --sage: #86a179;
    --line: rgba(74,51,54,0.14);
    --shadow: 0 20px 44px -22px rgba(74,51,54,0.32);
    --texture: radial-gradient(circle at 12% -6%, rgba(255,255,255,0.35), transparent 52%),
               radial-gradient(circle at 100% 108%, rgba(207,100,120,0.07), transparent 58%),
               radial-gradient(circle at 90% 0%, rgba(226,168,92,0.06), transparent 46%);
  }

  * { box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  html, body {
  max-width: 100%;
  overflow-x: hidden;
}
*, *::before, *::after {
  box-sizing: border-box;
}

  body{
    margin:0;
    min-height:100vh;
    font-family:'DM Sans', sans-serif;
    color:var(--ink);
    background: var(--bg-a);
    user-select: none;
    -webkit-user-select: none;
  }

  ::selection{ background: var(--raspberry); color:#fff8ee; }

  body::before{
    content:"";
    position:fixed; inset:0; z-index:99;
    pointer-events:none;
    opacity:0.035;
    /* Bỏ mix-blend-mode: multiply — nó buộc trình duyệt blend lại TOÀN BỘ trang
       mỗi khi có bất kỳ animation nào chạy bên dưới (orb, hạt sáng, con trỏ nhấp
       nháy...), tức gần như liên tục. Không có blend-mode thì lớp noise này chỉ
       là một ảnh mờ phủ lên trên, rẻ hơn nhiều cho GPU mà độ nhám nhìn vẫn tương tự. */
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: rgba(74,51,54,0.22); border-radius:8px; border:2px solid var(--bg-a); }
  ::-webkit-scrollbar-thumb:hover{ background: rgba(74,51,54,0.36); }

  @media (hover:hover) and (pointer:fine){
    body{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, auto;
    }
    a, button{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, pointer;
    }
    .disc-player,
    .progress-bar-container,
    #volume-slider-container{
      cursor: pointer !important;
    }
  }

  #gate{
    position:fixed; inset:0; z-index:100;
    width:100%; border:none;
    background: radial-gradient(circle at 50% 40%, #1a1412, #0d0b0a 70%);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    overflow:hidden;
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 0.9s cubic-bezier(.65,0,.35,1), opacity 0.9s cubic-bezier(.65,0,.35,1), filter 0.9s cubic-bezier(.65,0,.35,1);
  }
  #gate.hidden{
    opacity:0;
    filter: blur(18px);
    clip-path: circle(0% at 50% 50%);
    pointer-events:none;
  }
  #gate::before{
    content:"";
    position:absolute; inset:-20%;
    background: radial-gradient(circle at 50% 45%, rgba(207,100,120,0.22), transparent 55%),
                radial-gradient(circle at 20% 80%, rgba(226,168,92,0.10), transparent 50%),
                radial-gradient(circle at 82% 18%, rgba(134,161,121,0.09), transparent 48%);
    opacity:0.7;
    animation: gate-breathe 5s ease-in-out infinite;
  }
  #gate::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(rgba(243,236,226,0.05) 1px, transparent 1px) 0 0 / 100% 42px,
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
    opacity:0.5;
    pointer-events:none;
  }
  @keyframes gate-breathe{
    0%,100%{ transform: scale(1); opacity:0.5; }
    50%{ transform: scale(1.15); opacity:0.85; }
  }

  .gate-particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .gate-particles span{
    position:absolute;
    bottom:-8%;
    width: var(--s, 4px); height: var(--s, 4px);
    border-radius:50%;
    background: var(--c, #e2a85c);
    opacity:0;
    /* box-shadow rẻ hơn filter:drop-shadow (không cần dựng lại toàn bộ layer mỗi khung hình) */
    box-shadow: 0 0 5px var(--c, #e2a85c);
    will-change: transform, opacity;
    animation: gate-float var(--d, 9s) ease-in var(--delay, 0s) infinite;
  }
  @keyframes gate-float{
    0%{ transform: translate3d(0,0,0); opacity:0; }
    8%{ opacity: 0.75; }
    92%{ opacity: 0.55; }
    100%{ transform: translate3d(var(--x, 30px), -112vh, 0); opacity:0; }
  }

  .gate-inner{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding: 20px;
  }

  .gate-ring{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width: 122px; height: 122px;
    border-radius:50%;
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .gate-ring::before, .gate-ring::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border: 1px solid rgba(243,236,226,0.22);
  }
  .gate-ring::after{
    inset:-14px;
    border-color: rgba(207,100,120,0.28);
    animation: gate-ring-spin 14s linear infinite;
    border-style: dashed;
  }
  @keyframes gate-ring-spin{ to{ transform: rotate(360deg); } }
  #gate:hover .gate-ring{ transform: scale(1.06); }

  .gate-mark{
    position:relative;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--raspberry);
    opacity:0.92;
    animation: gate-mark-pulse 2.6s ease-in-out infinite;
  }
  @keyframes gate-mark-pulse{
    0%,100%{ transform: scale(1); opacity:0.75; }
    50%{ transform: scale(1.14); opacity:1; }
  }

  .gate-text{
    position:relative;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(20px, 4.5vw, 28px);
    letter-spacing: 0.02em;
    color: #f3ece2;
    opacity: 0.9;
    transition: letter-spacing 0.4s ease, color 0.4s ease;
  }
  #gate:hover .gate-text{ letter-spacing: 0.06em; color:#fff8ee; }

  .gate-text-underline{
    display:block; height:1px; margin-top:8px;
    background: linear-gradient(90deg, transparent, var(--raspberry), transparent);
    transform: scaleX(0.15); opacity:0.5;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), opacity 0.5s ease;
  }
  #gate:hover .gate-text-underline{ transform: scaleX(1); opacity:1; }

  .gate-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform:uppercase;
    color: rgba(243,236,226,0.4);
    animation: gate-pulse 2.4s ease-in-out infinite;
  }
  @keyframes gate-pulse{ 50%{ opacity: 0.4; } }

  .gate-burst{
    position:fixed; z-index:101; pointer-events:none;
    border-radius:50%;
    background: radial-gradient(circle, rgba(243,236,226,0.9), rgba(207,100,120,0.35) 55%, transparent 72%);
    transform: translate(-50%,-50%) scale(0);
    animation: gate-burst-anim 0.75s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes gate-burst-anim{
    0%{ transform: translate(-50%,-50%) scale(0); opacity:0.9; }
    100%{ transform: translate(-50%,-50%) scale(1); opacity:0; }
  }
  .gate-shard{
    position:fixed; z-index:101; pointer-events:none;
    border-radius:50%;
    animation: gate-shard-anim 0.9s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes gate-shard-anim{
    0%{ transform: translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
    100%{ transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  #main{ position:relative; min-height:100vh; }

  .bg-video-wrap{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
  }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%,-50%);
    object-fit: cover;
    object-position: 68% center;
    filter: saturate(0.9) brightness(1.05);
  }
  .bg-video-wrap::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(165deg, rgba(251,231,207,0.35), rgba(246,211,199,0.32));
    mix-blend-mode: soft-light;
  }
  .bg-video-wrap::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 30%, rgba(255,248,238,0.12), rgba(74,51,54,0.16) 85%);
    z-index:1;
  }

  .orb{
    position:fixed; z-index:1; border-radius:50%;
    filter: blur(44px); pointer-events:none;
    opacity:0.55;
    animation: orb-float 16s ease-in-out infinite;
    will-change: transform;
    transform: translateZ(0);
  }
  .orb-1{ width:260px; height:260px; top:6%; left:-6%; background: radial-gradient(circle, var(--raspberry), transparent 70%); animation-duration: 18s; }
  .orb-2{ width:220px; height:220px; bottom:8%; right:-5%; background: radial-gradient(circle, var(--mustard), transparent 70%); animation-duration: 21s; animation-delay: -6s; }
  .orb-3{ width:180px; height:180px; bottom:32%; left:4%; background: radial-gradient(circle, var(--sage), transparent 70%); animation-duration: 15s; animation-delay: -3s; }
  /* Chỉ dùng translate (không scale) — scale cùng với filter:blur buộc trình duyệt
     vẽ lại vùng blur mỗi khung hình, translate thì chỉ dịch chuyển layer đã dựng sẵn. */
  @keyframes orb-float{
    0%,100%{ transform: translateZ(0) translate(0,0); }
    33%{ transform: translateZ(0) translate(26px,-32px); }
    66%{ transform: translateZ(0) translate(-20px,20px); }
  }
  @media (max-width: 640px){
    .orb-3{ display:none; } /* bớt 1 lớp blur trên máy yếu/di động */
  }

  main{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding: 48px 20px 80px;
    perspective: 1200px;
  }

  .dock{
    display:flex; gap:14px;
    width: fit-content;
    margin: 0 auto;
    opacity:0;
    translate: 0 16px;
    transition: opacity 0.6s ease;
  }
  .dock.in{ opacity:1; translate: 0 0; }
  .dock-item{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    background: transparent;
    overflow:hidden;
    flex-shrink:0;
    transition: translate 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .dock-item{ position:relative; }
  .dock-item:hover{ translate: 0 -7px; }
  .dock-item::after{
    content: attr(data-tip);
    position:absolute; bottom: calc(100% + 10px); left:50%;
    transform: translate(-50%, 4px);
    background: var(--ink);
    color: #fdf6ec;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing:0.04em;
    padding: 4px 8px; border-radius: 6px;
    white-space:nowrap;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .dock-item::before{
    content:"";
    position:absolute; bottom: calc(100% + 5px); left:50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
    opacity:0;
    transition: opacity 0.2s ease;
  }
  .dock-item:hover::after{ opacity:1; transform: translate(-50%, 0); }
  .dock-item:hover::before{ opacity:1; }
  .dock-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter: drop-shadow(0 3px 6px rgba(74,51,54,0.28));
  }
  .dock-avatar{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .dock-wrap{
    position:relative; z-index:2;
    display:flex; justify-content:center;
    padding: 0 20px 56px;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 480px;
    background: none;
    border-radius: 14px;
    padding: 0 0 36px;
    opacity:0;
    transform: translateY(28px) scale(0.98);
    transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card.in{ opacity:1; transform: translateY(0) scale(1); }
  .card.tilt-ready{ transition: transform 0.2s cubic-bezier(.2,.8,.2,1), opacity 0.8s ease; }

  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding: 12px 18px;
    background: var(--paper-dim);
    background-image: var(--texture);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    position:relative; z-index:2;
  }
  .titlebar .dots{ display:flex; gap:6px; flex-shrink:0; }
  .titlebar .dot{ width:11px; height:11px; border-radius:50%; box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12); }
  .titlebar .dot.r{ background: var(--raspberry); }
  .titlebar .dot.y{ background: var(--mustard); }
  .titlebar .dot.g{ background: var(--sage); }

  .discord-status{
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing:0.03em;
    color: var(--ink-soft);
  }
  .status-led{
    width:7px; height:7px; border-radius:50%;
    background: rgba(74,51,54,0.28);
    flex-shrink:0;
  }
  .titlebar .path{
    flex:1; text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  /* ============ DISCORD MINI PROFILE ============ */
  .discord-mini-profile{
    position: relative;
    overflow: hidden;
    display:flex; flex-direction:column;
    width:100%;
    margin: 0 auto 20px;
    padding: 10px 14px 10px 10px;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.35);
    border-left: 3px solid var(--raspberry);
    border-radius: 8px;
    box-sizing:border-box;
    --dmp-nameplate: none;
    --dmp-nameplate-color: rgba(20,13,15,.9);
    transition: background .3s ease, border-color .3s ease;
  }

  /* ---- Nameplate thật lấy từ Discord (asset động + màu palette) ---- */
  .discord-mini-profile::before,
  .discord-mini-profile::after{
    content:"";
    position:absolute; inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .discord-mini-profile::before{
    background-image: var(--dmp-nameplate);
    background-color: var(--dmp-nameplate-color);
    background-size: cover;
    background-position: center;
    transform: scale(1.06);
  }
  .discord-mini-profile::after{
    background: linear-gradient(115deg, rgba(20,13,15,.85) 12%, rgba(20,13,15,.45) 55%, rgba(20,13,15,.72) 100%);
  }
  .discord-mini-profile .dmp-nameplate-video{
    position:absolute; inset:0;
    z-index:0;
    width:100%; height:100%;
    object-fit: cover;
    opacity:0;
    pointer-events:none;
    transform: scale(1.06);
    transition: opacity .35s ease;
  }
  .discord-mini-profile.has-nameplate{
    border-left-color: transparent;
    background: #14100f;
  }
  .discord-mini-profile.has-nameplate::before,
  .discord-mini-profile.has-nameplate::after,
  .discord-mini-profile.has-nameplate .dmp-nameplate-video{
    opacity:1;
  }
  .discord-mini-profile.has-nameplate .dmp-username{ color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.55); }
  .discord-mini-profile.has-nameplate .dmp-activity{ color:rgba(255,255,255,.78); }
  .discord-mini-profile.has-nameplate .dmp-status-dot{ background:#14100f; }
  .discord-mini-profile.has-nameplate .dmp-avatar{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 0 2px #14100f; }
  .discord-mini-profile.has-nameplate .dmp-activity-card{
    background: rgba(0,0,0,.32);
    border-color: rgba(255,255,255,.12);
  }
  .discord-mini-profile.has-nameplate .dmp-act-name{ color:#fff; }
  .discord-mini-profile.has-nameplate .dmp-act-details,
  .discord-mini-profile.has-nameplate .dmp-act-state,
  .discord-mini-profile.has-nameplate .dmp-act-time{ color:rgba(255,255,255,.72); }

  /* ---- Hàng icon: mic / tai nghe / cài đặt (giống thanh user Discord) ---- */
  .dmp-icons{
    display:flex; align-items:center; gap:2px;
    margin-left:auto; position:relative; z-index:1;
    flex-shrink:0;
  }
  .dmp-icon{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; padding:0; margin:0;
    color: var(--ink-soft);
    transition: color .2s, background .2s;
  }
  button.dmp-icon{ cursor:pointer; }
  .dmp-icon:hover{ background: rgba(74,51,54,0.08); color: var(--ink); }
  .dmp-icons .toggle-act-btn{ margin-left:0; }

  .discord-mini-profile.has-nameplate .dmp-icon{ color: rgba(255,255,255,.82); }
  .discord-mini-profile.has-nameplate .dmp-icon:hover{ background: rgba(255,255,255,.16); color:#fff; }
  .dmp-top{ display:flex; align-items:center; gap:12px; width:100%; position: relative; z-index: 1; }
  .dmp-avatar-wrap{ position:relative; width:46px; height:46px; flex-shrink:0; }
  .dmp-avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; display:block;
    background: var(--bg-b);
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12);
  }
  .dmp-decoration{
    position:absolute; inset:-6px;
    width:58px; height:58px;
    pointer-events:none;
  }

  /* Styling cho nút ... */
  .toggle-act-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    padding: 4px 6px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, background 0.2s, transform 0.2s;
    flex-shrink: 0;
    margin-left: auto;
  }

  .toggle-act-btn:hover {
    color: var(--ink);
    background: rgba(74, 51, 54, 0.08);
  }

  .toggle-act-btn.is-disabled {
    opacity: 0.4;
  }

  /* Khóa panel khi người dùng chủ động tắt */
  .dmp-activity-panel.user-collapsed {
    max-height: 0px !important;
    opacity: 0 !important;
    margin-top: 0px !important;
    pointer-events: none;
  }

  /* Chấm trạng thái kiểu Discord gốc */
  .dmp-status-dot{
    position:absolute; right:-2px; bottom:-2px;
    width:15px; height:15px; border-radius:50%;
    background: var(--paper-dim);
    box-sizing:border-box; z-index:2;
  }
  .dmp-status-dot::before{
    content:""; position:absolute; inset:2.5px; border-radius:50%;
    background:#80848e;
  }
  .dmp-status-dot.online::before{ background:#23a55a; animation: status-glow 2s ease-in-out infinite; }
  @keyframes status-glow{
    0%,100%{ box-shadow: 0 0 0 0 rgba(35,165,90,0.55); }
    50%{ box-shadow: 0 0 0 4px rgba(35,165,90,0); }
  }
  .dmp-status-dot.idle::before{ background:#f0b232; }
  .dmp-status-dot.dnd::before{ background:#f23f43; }
  .dmp-status-dot.offline::before{ background:#80848e; }
  .dmp-status-dot.idle::after{
    content:""; position:absolute; width:6.5px; height:6.5px; border-radius:50%;
    background: var(--paper-dim); top:1.5px; left:1.5px;
  }
  .dmp-status-dot.dnd::after{

        <div class="divider reveal" style="--i:3"><span>❊</span></div>

        <div class="discord-mini-profile reveal" style="--i:3.5" id="discord-mini-profile">
          <div class="dmp-top">
            <div class="dmp-avatar-wrap">
              <img id="dmp-avatar" class="dmp-avatar" src="" alt="avatar Discord">
              <img id="dmp-decoration" class="dmp-decoration" src="" alt="" style="display:none">
              <span id="dmp-status-dot" class="dmp-status-dot offline" aria-hidden="true"></span>
            </div>
            <div class="dmp-info">
              <div class="dmp-name-row">
                <span id="dmp-username" class="dmp-username">—</span>
                <span id="dmp-badges" class="dmp-badges"></span>
              </div>
              <span id="dmp-activity" class="dmp-activity">đang kết nối…</span>
            </div>
            <div class="dmp-icons">
              <button type="button" id="toggle-activity-btn" class="dmp-icon toggle-act-btn" aria-label="Ẩn/Hiện hoạt động" title="Ẩn/Hiện hoạt động">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                  <circle cx="5" cy="12" r="2.2"></circle>
                  <circle cx="12" cy="12" r="2.2"></circle>
                  <circle cx="19" cy="12" r="2.2"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="dmp-activity-panel" id="dmp-activity-panel">
            <div class="dmp-activity-card">
              <div class="dmp-act-img-wrap">
                <img id="dmp-act-img" class="dmp-act-img" src="" alt="" style="display:none">
                <img id="dmp-act-img-small" class="dmp-act-img-small" src="" alt="" style="display:none">
              </div>
              <div class="dmp-act-text">
                <p id="dmp-act-name" class="dmp-act-name"></p>
                <p id="dmp-act-details" class="dmp-act-details" style="display:none"></p>
                <p id="dmp-act-state" class="dmp-act-state" style="display:none"></p>
                <p id="dmp-act-time" class="dmp-act-time"></p>
              </div>
            </div>
          </div>
        </div>

        <p class="bio reveal" style="--i:4">Nothing Here.</p>

        <!-- SPOTIFY MUSIC BOX -->
        <div class="music-box reveal" style="--i:5" id="music-box">
          <div class="music-topline">
            <div class="disc-player" id="disc-player-cover" aria-hidden="true">
              <span class="disc-label" id="disc-label"></span>
            </div>
            
            <div class="music-info">
              <p class="music-title" id="music-title">Tên bài hát — nghệ sĩ</p>
              <p class="music-sub" id="disc-tip">bấm để phát nhạc</p>
            </div>

            <!-- NHỊP NHẠC THỜI GIAN THỰC -->
            <div class="music-bars" id="music-bars">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </div>

            <button class="music-playbtn" id="disc-player" type="button" aria-pressed="false" aria-label="Phát nhạc nền">
              <svg class="icon-play" viewBox="0 0 24 24" fill="#121212"><path d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="#121212"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button class="music-menu-btn" id="track-menu-btn" type="button" aria-label="Danh sách bài hát" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
          </div>

          <div class="music-progress-wrap">
            <span id="current-time" class="time-label">0:00</span>
            <div class="progress-bar-container" id="progress-container">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span id="duration-time" class="time-label">0:00</span>
          </div>

          <div class="music-nav" aria-label="Chuyển bài">
            <button type="button" id="music-prev" aria-label="Bài trước">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button type="button" id="music-next" aria-label="Bài tiếp theo">
              <svg viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg>
            </button>

            <div class="volume-container">
              <button type="button" id="volume-btn" aria-label="Âm lượng">
                <svg viewBox="0 0 24 24">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                  <path class="vol-wave" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </button>
              <div id="volume-slider-container">
                <div id="volume-slider-fill"></div>
              </div>
            </div>
          </div>

          <div class="track-list-panel" id="track-list-panel">
            <div class="track-list-header">
              <span>Danh sách phát</span>
              <button type="button" class="track-list-close" id="track-list-close" aria-label="Đóng danh sách">✕</button>
            </div>
            <ul class="track-list" id="track-list"></ul>
          </div>
        </div>

        <div class="now reveal" style="--i:6">
          <strong>đang làm gì:</strong> đang nghỉ hè
        </div>

        <footer class="reveal" id="footer-bar" style="--i:7" role="button" tabindex="0" aria-label="Nhấn để chạy lệnh terminal">
          <span class="dots foot-dots" id="foot-dots" aria-hidden="true">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
          </span>
          <span class="foot-text" id="foot-text">
            <span class="foot-typed" id="foot-typed"></span><span class="foot-cursor" id="foot-cursor">▌</span>
          </span>
          <span class="foot-hint" aria-hidden="true">
            next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M4 9a8 8 0 1 1 2 5.3"/></svg>
          </span>
        </footer>
      </div>
    </div>
  </main>

  <div class="dock-wrap">
    <nav class="dock" id="dock" aria-label="Mạng xã hội">
      <!-- Icon đang TẮT link (onclick="return false;" chặn hành vi mặc định).
           Khi có link thật, xoá onclick="return false;" và đổi href="#" thành
           URL của bạn, ví dụ href="https://discord.gg/xxxxx", rồi thêm lại
           target="_blank" rel="noopener" để mở tab mới. -->
      <a class="dock-item discord" href="#" onclick="return false;" data-tip="Discord"><span class="dock-avatar"><img src="discord.png" alt="Discord" ></span></a>
      <a class="dock-item youtube" href="#" onclick="return false;" data-tip="YouTube"><span class="dock-avatar"><img src="youtube.png" alt="YouTube"></span></a>
      <a class="dock-item facebook" href="#" onclick="return false;" data-tip="Facebook"><span class="dock-avatar"><img src="facebook.png" alt="Facebook"></span></a>
      <a class="dock-item roblox" href="#" onclick="return false;" data-tip="Roblox"><span class="dock-avatar"><img src="roblox.png" alt="roblox"></span></a>
    </nav>
  </div>
</div>

<script src="javascript.js"></script>
</body>
</html>
