<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazuuiie — bio</title>
<meta name="description" content="Trang bio cá nhân">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #fbe7cf;
    --bg-b: #f6d3c7;
    --paper-dim: #f9ecdd;
    --ink: #4a3336;
    --ink-soft: #8a6b62;
    --raspberry: #cf6478;
    --mustard: #e2a85c;
    --sage: #86a179;
    --line: rgba(74,51,54,0.14);
    --shadow: 0 20px 44px -22px rgba(74,51,54,0.32);
    --texture: radial-gradient(circle at 12% -6%, rgba(255,255,255,0.35), transparent 52%),
               radial-gradient(circle at 100% 108%, rgba(207,100,120,0.07), transparent 58%),
               radial-gradient(circle at 90% 0%, rgba(226,168,92,0.06), transparent 46%);
  }

  * { box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  html, body {
  max-width: 100%;
  overflow-x: hidden;
}
*, *::before, *::after {
  box-sizing: border-box;
}

  body{
    margin:0;
    min-height:100vh;
    font-family:'DM Sans', sans-serif;
    color:var(--ink);
    background: var(--bg-a);
    user-select: none;
    -webkit-user-select: none;
  }

  ::selection{ background: var(--raspberry); color:#fff8ee; }

  body::before{
    content:"";
    position:fixed; inset:0; z-index:99;
    pointer-events:none;
    opacity:0.035;
    /* Bỏ mix-blend-mode: multiply — nó buộc trình duyệt blend lại TOÀN BỘ trang
       mỗi khi có bất kỳ animation nào chạy bên dưới (orb, hạt sáng, con trỏ nhấp
       nháy...), tức gần như liên tục. Không có blend-mode thì lớp noise này chỉ
       là một ảnh mờ phủ lên trên, rẻ hơn nhiều cho GPU mà độ nhám nhìn vẫn tương tự. */
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: rgba(74,51,54,0.22); border-radius:8px; border:2px solid var(--bg-a); }
  ::-webkit-scrollbar-thumb:hover{ background: rgba(74,51,54,0.36); }

  @media (hover:hover) and (pointer:fine){
    body{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, auto;
    }
    a, button{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, pointer;
    }
    .disc-player,
    .progress-bar-container,
    #volume-slider-container{
      cursor: pointer !important;
    }
  }

  #gate{
    position:fixed; inset:0; z-index:100;
    width:100%; border:none;
    background: radial-gradient(circle at 50% 40%, #1a1412, #0d0b0a 70%);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    overflow:hidden;
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 0.9s cubic-bezier(.65,0,.35,1), opacity 0.9s cubic-bezier(.65,0,.35,1), filter 0.9s cubic-bezier(.65,0,.35,1);
  }
  #gate.hidden{
    opacity:0;
    filter: blur(18px);
    clip-path: circle(0% at 50% 50%);
    pointer-events:none;
  }
  #gate::before{
    content:"";
    position:absolute; inset:-20%;
    background: radial-gradient(circle at 50% 45%, rgba(207,100,120,0.22), transparent 55%),
                radial-gradient(circle at 20% 80%, rgba(226,168,92,0.10), transparent 50%),
                radial-gradient(circle at 82% 18%, rgba(134,161,121,0.09), transparent 48%);
    opacity:0.7;
    animation: gate-breathe 5s ease-in-out infinite;
  }
  #gate::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(rgba(243,236,226,0.05) 1px, transparent 1px) 0 0 / 100% 42px,
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
    opacity:0.5;
    pointer-events:none;
  }
  @keyframes gate-breathe{
    0%,100%{ transform: scale(1); opacity:0.5; }
    50%{ transform: scale(1.15); opacity:0.85; }
  }

  .gate-particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .gate-particles span{
    position:absolute;
    bottom:-8%;
    width: var(--s, 4px); height: var(--s, 4px);
    border-radius:50%;
    background: var(--c, #e2a85c);
    opacity:0;
    /* box-shadow rẻ hơn filter:drop-shadow (không cần dựng lại toàn bộ layer mỗi khung hình) */
    box-shadow: 0 0 5px var(--c, #e2a85c);
    will-change: transform, opacity;
    animation: gate-float var(--d, 9s) ease-in var(--delay, 0s) infinite;
  }
  @keyframes gate-float{
    0%{ transform: translate3d(0,0,0); opacity:0; }
    8%{ opacity: 0.75; }
    92%{ opacity: 0.55; }
    100%{ transform: translate3d(var(--x, 30px), -112vh, 0); opacity:0; }
  }

  .gate-inner{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding: 20px;
  }

  .gate-ring{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width: 122px; height: 122px;
    border-radius:50%;
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .gate-ring::before, .gate-ring::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border: 1px solid rgba(243,236,226,0.22);
  }
  .gate-ring::after{
    inset:-14px;
    border-color: rgba(207,100,120,0.28);
    animation: gate-ring-spin 14s linear infinite;
    border-style: dashed;
  }
  @keyframes gate-ring-spin{ to{ transform: rotate(360deg); } }
  #gate:hover .gate-ring{ transform: scale(1.06); }

  .gate-mark{
    position:relative;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--raspberry);
    opacity:0.92;
    animation: gate-mark-pulse 2.6s ease-in-out infinite;
  }
  @keyframes gate-mark-pulse{
    0%,100%{ transform: scale(1); opacity:0.75; }
    50%{ transform: scale(1.14); opacity:1; }
  }

  .gate-text{
    position:relative;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(20px, 4.5vw, 28px);
    letter-spacing: 0.02em;
    color: #f3ece2;
    opacity: 0.9;
    transition: letter-spacing 0.4s ease, color 0.4s ease;
  }
  #gate:hover .gate-text{ letter-spacing: 0.06em; color:#fff8ee; }

  .gate-text-underline{
    display:block; height:1px; margin-top:8px;
    background: linear-gradient(90deg, transparent, var(--raspberry), transparent);
    transform: scaleX(0.15); opacity:0.5;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), opacity 0.5s ease;
  }
  #gate:hover .gate-text-underline{ transform: scaleX(1); opacity:1; }

  .gate-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform:uppercase;
    color: rgba(243,236,226,0.4);
    animation: gate-pulse 2.4s ease-in-out infinite;
  }
  @keyframes gate-pulse{ 50%{ opacity: 0.4; } }

  .gate-burst{
    position:fixed; z-index:101; pointer-events:none;
    border-radius:50%;
    background: radial-gradient(circle, rgba(243,236,226,0.9), rgba(207,100,120,0.35) 55%, transparent 72%);
    transform: translate(-50%,-50%) scale(0);
    animation: gate-burst-anim 0.75s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes gate-burst-anim{
    0%{ transform: translate(-50%,-50%) scale(0); opacity:0.9; }
    100%{ transform: translate(-50%,-50%) scale(1); opacity:0; }
  }
  .gate-shard{
    position:fixed; z-index:101; pointer-events:none;
    border-radius:50%;
    animation: gate-shard-anim 0.9s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes gate-shard-anim{
    0%{ transform: translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
    100%{ transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  #main{ position:relative; min-height:100vh; }

  .bg-video-wrap{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
  }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%,-50%);
    object-fit: cover;
    object-position: 68% center;
    filter: saturate(0.9) brightness(1.05);
  }
  .bg-video-wrap::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(165deg, rgba(251,231,207,0.35), rgba(246,211,199,0.32));
    mix-blend-mode: soft-light;
  }
  .bg-video-wrap::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 30%, rgba(255,248,238,0.12), rgba(74,51,54,0.16) 85%);
    z-index:1;
  }

  .orb{
    position:fixed; z-index:1; border-radius:50%;
    filter: blur(44px); pointer-events:none;
    opacity:0.55;
    animation: orb-float 16s ease-in-out infinite;
    will-change: transform;
    transform: translateZ(0);
  }
  .orb-1{ width:260px; height:260px; top:6%; left:-6%; background: radial-gradient(circle, var(--raspberry), transparent 70%); animation-duration: 18s; }
  .orb-2{ width:220px; height:220px; bottom:8%; right:-5%; background: radial-gradient(circle, var(--mustard), transparent 70%); animation-duration: 21s; animation-delay: -6s; }
  .orb-3{ width:180px; height:180px; bottom:32%; left:4%; background: radial-gradient(circle, var(--sage), transparent 70%); animation-duration: 15s; animation-delay: -3s; }
  /* Chỉ dùng translate (không scale) — scale cùng với filter:blur buộc trình duyệt
     vẽ lại vùng blur mỗi khung hình, translate thì chỉ dịch chuyển layer đã dựng sẵn. */
  @keyframes orb-float{
    0%,100%{ transform: translateZ(0) translate(0,0); }
    33%{ transform: translateZ(0) translate(26px,-32px); }
    66%{ transform: translateZ(0) translate(-20px,20px); }
  }
  @media (max-width: 640px){
    .orb-3{ display:none; } /* bớt 1 lớp blur trên máy yếu/di động */
  }

  main{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding: 48px 20px 80px;
    perspective: 1200px;
  }

  .dock{
    display:flex; gap:14px;
    width: fit-content;
    margin: 0 auto;
    opacity:0;
    translate: 0 16px;
    transition: opacity 0.6s ease;
  }
  .dock.in{ opacity:1; translate: 0 0; }
  .dock-item{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    background: transparent;
    overflow:hidden;
    flex-shrink:0;
    transition: translate 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .dock-item{ position:relative; }
  .dock-item:hover{ translate: 0 -7px; }
  .dock-item::after{
    content: attr(data-tip);
    position:absolute; bottom: calc(100% + 10px); left:50%;
    transform: translate(-50%, 4px);
    background: var(--ink);
    color: #fdf6ec;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing:0.04em;
    padding: 4px 8px; border-radius: 6px;
    white-space:nowrap;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .dock-item::before{
    content:"";
    position:absolute; bottom: calc(100% + 5px); left:50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
    opacity:0;
    transition: opacity 0.2s ease;
  }
  .dock-item:hover::after{ opacity:1; transform: translate(-50%, 0); }
  .dock-item:hover::before{ opacity:1; }
  .dock-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter: drop-shadow(0 3px 6px rgba(74,51,54,0.28));
  }
  .dock-avatar{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .dock-wrap{
    position:relative; z-index:2;
    display:flex; justify-content:center;
    padding: 0 20px 56px;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 480px;
    background: none;
    border-radius: 14px;
    padding: 0 0 36px;
    opacity:0;
    transform: translateY(28px) scale(0.98);
    transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card.in{ opacity:1; transform: translateY(0) scale(1); }
  .card.tilt-ready{ transition: transform 0.2s cubic-bezier(.2,.8,.2,1), opacity 0.8s ease; }

  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding: 12px 18px;
    background: var(--paper-dim);
    background-image: var(--texture);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    position:relative; z-index:2;
  }
  .titlebar .dots{ display:flex; gap:6px; flex-shrink:0; }
  .titlebar .dot{ width:11px; height:11px; border-radius:50%; box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12); }
  .titlebar .dot.r{ background: var(--raspberry); }
  .titlebar .dot.y{ background: var(--mustard); }
  .titlebar .dot.g{ background: var(--sage); }

  .discord-status{
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing:0.03em;
    color: var(--ink-soft);
  }
  .status-led{
    width:7px; height:7px; border-radius:50%;
    background: rgba(74,51,54,0.28);
    flex-shrink:0;
  }
  .titlebar .path{
    flex:1; text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  /* ============ DISCORD MINI PROFILE ============ */
  .discord-mini-profile{
    position: relative;
    display:flex; flex-direction:column;
    width:100%;
    margin: 0 auto 22px;
    padding: 0 0 10px 0;
    background: rgba(255,255,255,0.24);
    /* 2 lớp: highlight tròn mờ ở góc trên-trái (như ánh sáng chiếu vào mặt
       kính) nằm trên lớp gradient chéo nhạt — cùng kiểu ánh sáng mà
       .music-box::before đang dùng, để đồng bộ cảm giác "kính" giữa 2 khối. */
    background-image:
      radial-gradient(circle at 14% -12%, rgba(255,255,255,0.55), transparent 52%),
      linear-gradient(150deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.4);
    border-left: 3px solid var(--raspberry);
    border-radius: 14px;
    box-sizing:border-box;
    overflow: hidden;
    box-shadow: 0 16px 30px -22px rgba(74,51,54,0.4), 0 1px 0 rgba(255,255,255,0.5) inset;
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .discord-mini-profile:hover{
    box-shadow: 0 20px 38px -20px rgba(74,51,54,0.46), 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  /* Viền màu theo trạng thái online/idle/dnd — cùng kỹ thuật với
     .music-box.is-playing (thêm 1 vòng màu mảnh vào box-shadow), giúp cả
     card "sống" theo đúng màu chấm trạng thái thay vì luôn tĩnh 1 kiểu. */
  .discord-mini-profile:has(.dmp-status-dot.online){
    box-shadow: 0 16px 30px -22px rgba(74,51,54,0.4), 0 1px 0 rgba(255,255,255,0.5) inset, 0 0 0 1px rgba(35,165,90,0.3);
  }
  .discord-mini-profile:has(.dmp-status-dot.idle){
    box-shadow: 0 16px 30px -22px rgba(74,51,54,0.4), 0 1px 0 rgba(255,255,255,0.5) inset, 0 0 0 1px rgba(240,178,50,0.3);
  }
  .discord-mini-profile:has(.dmp-status-dot.dnd){
    box-shadow: 0 16px 30px -22px rgba(74,51,54,0.4), 0 1px 0 rgba(255,255,255,0.5) inset, 0 0 0 1px rgba(242,63,67,0.3);
  }
  .discord-mini-profile::before{
    content:"$ discord --whoami";
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing:0.05em;
    color: var(--ink-soft);
    opacity:0.65;
    padding: 9px 14px 7px;
  }
  .discord-mini-profile.has-nameplate{
    border-color: rgba(255,255,255,0.14);
    border-left-color: transparent;
    /* Trước đây chỉ zone nameplate (avatar+tên) có nền tối, còn activity panel
       bên dưới bỏ trong suốt — nên khi nền trang là ảnh/video sặc sỡ, nửa dưới
       card bị "ăn" màu lung tung theo hình nền, tạo cảm giác lệch tông so với
       nửa trên (tối). Giờ phủ thêm 1 lớp gradient tối nhẹ + blur mạnh hơn lên
       TOÀN BỘ card khi có nameplate, để cả khối liền một tông màu với zone
       nameplate ở trên — cân bằng và dễ đọc chữ hơn hẳn. */
    background-color: transparent;
    background-image:
      radial-gradient(circle at 14% -12%, rgba(255,255,255,0.12), transparent 48%),
      linear-gradient(180deg, rgba(20,16,15,0.58) 0%, rgba(20,16,15,0.74) 100%);
    backdrop-filter: blur(18px) saturate(1.05);
    -webkit-backdrop-filter: blur(18px) saturate(1.05);
    box-shadow: 0 18px 34px -20px rgba(0,0,0,0.55);
  }
  .discord-mini-profile.has-nameplate:has(.dmp-status-dot.online){
    box-shadow: 0 18px 34px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(35,165,90,0.35);
  }
  .discord-mini-profile.has-nameplate:has(.dmp-status-dot.idle){
    box-shadow: 0 18px 34px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(240,178,50,0.35);
  }
  .discord-mini-profile.has-nameplate:has(.dmp-status-dot.dnd){
    box-shadow: 0 18px 34px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(242,63,67,0.35);
  }
  .discord-mini-profile.has-nameplate::before{ color: rgba(255,248,238,0.55); }
  .discord-mini-profile.has-nameplate .dmp-nameplate-zone{
    background: #14100f;
  }

  /* ---- Zone nameplate: CHỈ bọc quanh hàng avatar/tên (dmp-top), không bọc
     activity panel. Vì vậy chiều cao của zone này cố định — khi bấm nút "..."
     để mở/đóng activity panel bên dưới, nameplate (ảnh/video nền) không còn
     bị kéo giãn/phóng to theo và không còn che mất activity panel nữa. ---- */
  .dmp-nameplate-zone{
    position: relative;
    overflow: hidden;
    /* padding-bottom = 8px: đủ chỗ cho .dmp-decoration (inset:-6px, tức tràn
       ra ngoài dmp-avatar-wrap 6px mỗi cạnh) và dmp-status-dot (bottom:-2px)
       không bị overflow:hidden của zone cắt mất phần dưới nữa. Trước đây
       bottom = 0 nên viền trang trí (decoration) quanh avatar bị cắt phẳng
       ở cạnh dưới, trông như bị mất một mảnh. Chỉ đổi padding của zone (zone
       chỉ bọc dmp-top) — không đụng .dmp-activity-panel nên activity card
       không bị ảnh hưởng gì. */
    padding: 10px 14px 8px 10px;
    --dmp-nameplate: none;
    --dmp-nameplate-color: rgba(20,13,15,.9);
  }
  .dmp-nameplate-zone::before,

  /* ---- Hàng icon: mic / tai nghe / cài đặt (giống thanh user Discord) ---- */

    transition: box-shadow .4s ease;
  }
  /* Quầng sáng mềm sau avatar theo màu trạng thái — .dmp-avatar không
     position:absolute nên box-shadow của nó luôn vẽ dưới lớp .dmp-decoration
     và .dmp-status-dot (2 cái đó có position:absolute), tức quầng sáng nằm
     đúng phía sau viền trang trí, không đè lên. */
  .dmp-avatar-wrap:has(.dmp-status-dot.online) .dmp-avatar{
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12), 0 3px 8px -2px rgba(74,51,54,0.35), 0 0 0 7px rgba(35,165,90,0.16), 0 0 18px 4px rgba(35,165,90,0.22);
  }
  .dmp-avatar-wrap:has(.dmp-status-dot.idle) .dmp-avatar{
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12), 0 3px 8px -2px rgba(74,51,54,0.35), 0 0 0 7px rgba(240,178,50,0.14), 0 0 18px 4px rgba(240,178,50,0.18);
  }
  .dmp-avatar-wrap:has(.dmp-status-dot.dnd) .dmp-avatar{
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12), 0 3px 8px -2px rgba(74,51,54,0.35), 0 0 0 7px rgba(242,63,67,0.14), 0 0 18px 4px rgba(242,63,67,0.18);

    cursor: pointer;

    justify-content: center;

    flex-shrink: 0;
    margin-left: auto;
  }

  .toggle-act-btn:hover {
    color: var(--ink);

  /* Khóa panel khi người dùng chủ động tắt */

    opacity: 0 !important;
    margin-top: 0px !important;
    pointer-events: none;

  /* Chấm trạng thái kiểu Discord gốc */
  .dmp-status-dot{
    position:absolute; right:-2px; bottom:-2px;
    width:15px; height:15px; border-radius:50%;
    background: var(--paper-dim);
    box-sizing:border-box; z-index:2;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .dmp-status-dot::before{
    content:""; position:absolute; inset:2.5px; border-radius:50%;
    background:#80848e;
  }
  .dmp-status-dot.online::before{ background:#23a55a; animation: status-glow 2s ease-in-out infinite; }
  @keyframes status-glow{
    0%,100%{ box-shadow: 0 0 0 0 rgba(35,165,90,0.55); }
    50%{ box-shadow: 0 0 0 4px rgba(35,165,90,0); }
  }
  .dmp-status-dot.idle::before{ background:#f0b232; }
  .dmp-status-dot.dnd::before{ background:#f23f43; }
  .dmp-status-dot.offline::before{ background:#80848e; }
  .dmp-status-dot.idle::after{
    content:""; position:absolute; width:6.5px; height:6.5px; border-radius:50%;
    background: var(--paper-dim); top:1.5px; left:1.5px;
  }
  .dmp-status-dot.dnd::after{
    content:""; position:absolute; width:6.5px; height:2px; border-radius:1px;
    background:#fff8ee; top:6.5px; left:4.2px;
  }

     với "$ discord --whoami" và .now::before ("$ cat status.log") — chỉ là

  .dmp-activity-panel.open .dmp-activity-card::before{

    text-transform:uppercase; color: rgba(255,248,238,0.4);
  }
  .track-item.active .t-category{ color: rgba(29,185,84,0.75); }
  .track-list-empty{
    text-align:center; padding:16px 0; font-family:'DM Sans', sans-serif;
    font-size:11.5px; color: rgba(255,248,238,0.45);
  }

  .mini-bars {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    margin-left: auto;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 1px;
  }
  
  .music-box.is-playing .track-item.active .mini-bars {
    display: flex;
  }

  .mini-bars .m-bar {
    width: 2px;
    height: 100%;
    background-color: #1DB954;
    transform-origin: bottom center !important;
    transform: scaleY(0.1);
    transition: transform 0.06s ease;
  }

  /* ===== PHOTO & CONTENT ===== */
  .photo-wrap{
    position:relative; width: 196px; margin: -78px auto 28px;
    display:flex; align-items:center; justify-content:center;
    animation: photo-idle 5.5s ease-in-out infinite;
  }
  @keyframes photo-idle{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }
  .photo-shadow{
    position:absolute; width: 76%; height: 72%; top: 12%;
    border-radius: 6px; background: radial-gradient(circle, rgba(74,51,54,0.22), transparent 75%);
    filter: blur(12px); transform: translateY(18px) rotate(-4deg);
  }
  .photo-frame{
    position:relative; width: 176px; background-color: rgba(255,254,252,0.55);
    background-image: var(--texture); padding: 10px 10px 26px; border-radius: 6px;
    rotate: -4deg; transition: rotate 0.4s ease;
  }
  .photo-frame:hover{ rotate: 0deg; }
  .album-cover{ display:block; width: 156px; height: 156px; object-fit:cover; border-radius: 2px; }

  .eyebrow{
    text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); margin: 0 0 6px;
  }
  .eyebrow::before{ content:"$ whoami"; display:block; color: var(--raspberry); margin-bottom:3px; opacity:0.75; }

  h1{
    text-align:center; font-family:'Fraunces', serif; font-weight: 600;
    font-size: clamp(32px, 8vw, 42px); margin: 0 0 4px; line-height:1.05;
  }
  h1 em{ font-style: italic; font-weight:500; color: var(--raspberry); }

  .location{ text-align:center; font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }
  .location::before{ content:"📍 "; }

  .divider{
    display:flex; align-items:center; justify-content:center; margin: 0 0 24px;
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--line);
  }

  .bio{
    text-align:left; font-size: 14.5px; line-height:1.75; color: var(--ink);
    margin: 0 auto 26px; font-family:'IBM Plex Mono', monospace;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35);
    border-left: 3px solid var(--raspberry); border-radius: 8px; padding: 14px 16px;
  }
  .bio::before{ content:"# about.txt"; display:block; font-size:10px; color: var(--ink-soft); margin-bottom:8px; }

  .now{
    margin-top: 26px; padding: 14px 16px; border-radius: 12px;
    background: rgba(124,148,115,0.14); border: 1px dashed rgba(124,148,115,0.5);
    font-size: 13.5px; color: var(--ink-soft); text-align:left;
  }
  .now::before{ content:"$ cat status.log"; display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; margin-bottom:6px; opacity:0.7; }
  .now strong{ color: var(--sage); font-family:'IBM Plex Mono', monospace; font-weight:500; }

  footer{
    display:flex; align-items:center; gap:10px; text-align:left; margin-top: 22px;
    padding: 12px 18px; background: var(--paper-dim); background-image: var(--texture);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
    /* .card-inner có padding trái/phải 30px — kéo footer ra bằng margin âm
       để nó rộng bằng .titlebar (vốn nằm ngoài padding đó). Đổi 30px này nếu
       bạn đổi padding của .card-inner ở trên. */
    margin-left: -30px;
    margin-right: -30px;
    width: calc(100% + 60px);
  }
  .foot-dots{ display:flex; gap:6px; flex-shrink:0; }
  .foot-dots .dot{
    width:11px; height:11px; border-radius:50%;
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .foot-dots .dot.r{ background: var(--raspberry); }
  .foot-dots .dot.y{ background: var(--mustard); }
  .foot-dots .dot.g{ background: var(--sage); }
  .foot-dots.pulse .dot{ animation: foot-dot-pulse 0.9s ease-in-out infinite; }
  .foot-dots.pulse .dot.y{ animation-delay: 0.12s; }
  .foot-dots.pulse .dot.g{ animation-delay: 0.24s; }
  @keyframes foot-dot-pulse{
    0%,100%{ opacity:0.55; transform: scale(0.85); }
    50%{ opacity:1; transform: scale(1); }
  }

  footer#footer-bar{
    cursor:pointer;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease, border-color 0.25s ease;
  }
  footer#footer-bar:hover{
    transform: translateY(-3px);
    border-color: rgba(207,100,120,0.35);
    box-shadow: 0 24px 44px -20px rgba(74,51,54,0.4);
  }
  footer#footer-bar:active{ transform: translateY(-1px) scale(0.995); }
  footer#footer-bar:focus-visible{ outline: 2px solid var(--raspberry); outline-offset: 2px; }

  .foot-text{
    flex:1; min-width:0;
    display:flex; align-items:baseline; gap:6px;
    white-space:nowrap; overflow:hidden;
  }
  .foot-text::before{
    content:"$"; flex-shrink:0;
    color: var(--raspberry); opacity:0.8;
  }
  .foot-typed{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color: var(--ink);
  }
  .foot-cursor{
    display:inline-block; width:6px; margin-left:1px;
    color: var(--raspberry);
    animation: foot-cursor-blink 1s step-end infinite;
  }
  @keyframes foot-cursor-blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }

  .foot-hint{
    flex-shrink:0;
    display:flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--ink-soft);
    opacity:0.75;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .foot-hint svg{ width:11px; height:11px; flex-shrink:0; transition: transform 0.35s ease; }
  footer#footer-bar:hover .foot-hint{ opacity:1; color: var(--raspberry); }
  footer#footer-bar:hover .foot-hint svg{ transform: rotate(180deg); }
</style>
</head>
