<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazuuiie — bio</title>
<meta name="description" content="Trang bio cá nhân">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #fbe7cf;
    --bg-b: #f6d3c7;
    --paper-dim: #f9ecdd;
    --ink: #4a3336;
    --ink-soft: #8a6b62;
    --raspberry: #cf6478;
    --mustard: #e2a85c;
    --sage: #86a179;
    --line: rgba(74,51,54,0.14);
    --shadow: 0 20px 44px -22px rgba(74,51,54,0.32);
    --texture: radial-gradient(circle at 12% -6%, rgba(255,255,255,0.35), transparent 52%),
               radial-gradient(circle at 100% 108%, rgba(207,100,120,0.07), transparent 58%),
               radial-gradient(circle at 90% 0%, rgba(226,168,92,0.06), transparent 46%);
  }

  * { box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  html, body {
  max-width: 100%;
  overflow-x: hidden;
}
*, *::before, *::after {
  box-sizing: border-box;
}

  body{
    margin:0;
    min-height:100vh;
    font-family:'DM Sans', sans-serif;
    color:var(--ink);
    background: var(--bg-a);
    user-select: none;
    -webkit-user-select: none;
  }

  @media (hover:hover) and (pointer:fine){
    body{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, auto;
    }
    a, button{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="17" viewBox="0 0 15 17"><path d="M1.5 1.5 L1.5 13.5 L4.6 10.7 L6.6 15 L8.6 14 L6.7 9.7 L11.5 9.7 Z" fill="%23FFE4E1"/></svg>') 1.5 1.5, pointer;
    }
    .disc-player,
    .progress-bar-container,
    #volume-slider-container{
      cursor: pointer !important;
    }
  }

  #gate{
    position:fixed; inset:0; z-index:100;
    width:100%; border:none;
    background:#0d0b0a;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    overflow:hidden;
    transition: opacity 0.7s cubic-bezier(.4,0,.2,1), filter 0.7s cubic-bezier(.4,0,.2,1);
  }
  #gate.hidden{
    opacity:0;
    filter: blur(14px);
    pointer-events:none;
  }
  #gate::before{
    content:"";
    position:absolute; inset:-20%;
    background: radial-gradient(circle at 50% 45%, rgba(207,100,120,0.18), transparent 55%);
    opacity:0.7;
    animation: gate-breathe 5s ease-in-out infinite;
  }
  @keyframes gate-breathe{
    0%,100%{ transform: scale(1); opacity:0.5; }
    50%{ transform: scale(1.15); opacity:0.85; }
  }
  .gate-text{
    position:relative;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(20px, 4.5vw, 28px);
    letter-spacing: 0.02em;
    color: #f3ece2;
    opacity: 0.88;
    animation: gate-pulse 2.4s ease-in-out infinite;
  }
  @keyframes gate-pulse{ 50%{ opacity: 0.4; } }

  #main{ position:relative; min-height:100vh; }

  .bg-video-wrap{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
  }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%,-50%);
    object-fit: cover;
    object-position: 68% center;
    filter: saturate(0.9) brightness(1.05);
  }
  .bg-video-wrap::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(165deg, rgba(251,231,207,0.35), rgba(246,211,199,0.32));
    mix-blend-mode: soft-light;
  }
  .bg-video-wrap::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 30%, rgba(255,248,238,0.12), rgba(74,51,54,0.16) 85%);
    z-index:1;
  }

  main{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding: 48px 20px 80px;
  }

  .dock{
    display:flex; gap:14px;
    width: fit-content;
    margin: 0 auto;
    opacity:0;
    translate: 0 16px;
    transition: opacity 0.6s ease;
  }
  .dock.in{ opacity:1; translate: 0 0; }
  .dock-item{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    background: transparent;
    overflow:hidden;
    flex-shrink:0;
    transition: translate 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .dock-item:hover{ translate: 0 -7px; }
  .dock-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter: drop-shadow(0 3px 6px rgba(74,51,54,0.28));
  }
  .dock-avatar{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .dock-wrap{
    position:relative; z-index:2;
    display:flex; justify-content:center;
    padding: 0 20px 56px;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 480px;
    background: none;
    border-radius: 14px;
    padding: 0 0 36px;
    opacity:0;
    transform: translateY(28px) scale(0.98);
    transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
  }
  .card.in{ opacity:1; transform: translateY(0) scale(1); }

  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding: 12px 18px;
    background: var(--paper-dim);
    background-image: var(--texture);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    position:relative; z-index:2;
  }
  .titlebar .dots{ display:flex; gap:6px; flex-shrink:0; }
  .titlebar .dot{ width:11px; height:11px; border-radius:50%; box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12); }
  .titlebar .dot.r{ background: var(--raspberry); }
  .titlebar .dot.y{ background: var(--mustard); }
  .titlebar .dot.g{ background: var(--sage); }

  .discord-status{
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing:0.03em;
    color: var(--ink-soft);
  }
  .status-led{
    width:7px; height:7px; border-radius:50%;
    background: rgba(74,51,54,0.28);
    flex-shrink:0;
  }
  .titlebar .path{
    flex:1; text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  /* ============ DISCORD MINI PROFILE ============ */
  .discord-mini-profile{
    position: relative;
    overflow: hidden;
    display:flex; flex-direction:column;
    width:100%;
    margin: 0 auto 20px;
    padding: 10px 14px 10px 10px;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.35);
    border-left: 3px solid var(--raspberry);
    border-radius: 8px;
    box-sizing:border-box;
  }
  .dmp-top{ display:flex; align-items:center; gap:12px; width:100%; position: relative; z-index: 1; }
  .dmp-avatar-wrap{ position:relative; width:46px; height:46px; flex-shrink:0; }
  .dmp-avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; display:block;
    background: var(--bg-b);
    box-shadow: inset 0 0 0 1px rgba(74,51,54,0.12);
  }
  .dmp-decoration{
    position:absolute; inset:-6px;
    width:58px; height:58px;
    pointer-events:none;
  }

  /* Styling cho nút ... */
  .toggle-act-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    padding: 4px 6px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, background 0.2s, transform 0.2s;
    flex-shrink: 0;
    margin-left: auto;
  }

  .toggle-act-btn:hover {
    color: var(--ink);
    background: rgba(74, 51, 54, 0.08);
  }

  .toggle-act-btn.is-disabled {
    opacity: 0.4;
  }

  /* Khóa panel khi người dùng chủ động tắt */
  .dmp-activity-panel.user-collapsed {
    max-height: 0px !important;
    opacity: 0 !important;
    margin-top: 0px !important;
    pointer-events: none;
  }

  /* Chấm trạng thái kiểu Discord gốc */
  .dmp-status-dot{
    position:absolute; right:-2px; bottom:-2px;
    width:15px; height:15px; border-radius:50%;
    background: var(--paper-dim);
    box-sizing:border-box; z-index:2;
  }
  .dmp-status-dot::before{
    content:""; position:absolute; inset:2.5px; border-radius:50%;
    background:#80848e;
  }
  .dmp-status-dot.online::before{ background:#23a55a; }
  .dmp-status-dot.idle::before{ background:#f0b232; }
  .dmp-status-dot.dnd::before{ background:#f23f43; }
  .dmp-status-dot.offline::before{ background:#80848e; }
  .dmp-status-dot.idle::after{
    content:""; position:absolute; width:6.5px; height:6.5px; border-radius:50%;
    background: var(--paper-dim); top:1.5px; left:1.5px;
  }
  .dmp-status-dot.dnd::after{
    content:""; position:absolute; width:6.5px; height:2px; border-radius:1px;
    background:#fff8ee; top:6.5px; left:4.2px;
  }

  .dmp-info{ display:flex; flex-direction:column; gap:3px; min-width:0; text-align:left; flex:1; }
  .dmp-name-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .dmp-username{
    font-family:'DM Sans', sans-serif; font-weight:700;
    font-size: 14px; color: var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;
  }
  .dmp-badges{ display:inline-flex; align-items:center; gap:4px; }
  .dmp-badge{
    font-size: 12px; line-height:1;
    filter: drop-shadow(0 1px 1px rgba(74,51,54,0.2));
  }
  .dmp-activity{
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .dmp-activity-panel{
    width:100%; overflow:hidden;
    max-height:0; opacity:0; margin-top:0;
    transition: max-height 0.42s cubic-bezier(.2,.8,.2,1), opacity 0.32s ease, margin-top 0.42s ease;
  }
  .dmp-activity-panel.open{ opacity:1; margin-top:10px; }
  .dmp-activity-card{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px;
    background: rgba(74,51,54,0.06);
    border: 1px solid rgba(74,51,54,0.08);
    border-radius:8px;
  }
  .dmp-act-img-wrap{ position:relative; width:40px; height:40px; flex-shrink:0; }
  .dmp-act-img{
    width:40px; height:40px; border-radius:9px; object-fit:cover; display:block;
    background: var(--bg-b);
  }
  .dmp-act-img-small{
    position:absolute; right:-4px; bottom:-4px; width:17px; height:17px; border-radius:50%;
    border:2px solid var(--paper-dim); object-fit:cover; background: var(--bg-b);
  }
  .dmp-act-text{ min-width:0; text-align:left; flex:1; }
  .dmp-act-name{
    margin:0; font-family:'DM Sans', sans-serif; font-weight:700;
    font-size:12.5px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dmp-act-details, .dmp-act-state{
    margin:2px 0 0; font-family:'DM Sans', sans-serif; font-size:11.5px;
    color: var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dmp-act-time{
    margin:4px 0 0; font-family:'IBM Plex Mono', monospace; font-size:10px;
    color: var(--ink-soft); opacity:0.85;
  }

/* Phóng to nhẹ khi di chuột vào chấm */
.dmp-status-dot:hover {
  transform: scale(1.25);
}


  .card-inner{ padding: 26px 30px 0; position:relative; z-index:2; }

  .reveal{
    opacity:0;
    translate: 0 12px;
    filter: blur(3px);
    transition: opacity 0.6s ease, translate 0.6s cubic-bezier(.2,.8,.2,1), filter 0.6s ease;
    transition-delay: calc(var(--i, 0) * 90ms + 150ms);
  }
  .card.in .reveal{ opacity:1; translate: 0 0; filter: blur(0); }

  /* ===== SPOTIFY MUSIC BOX ===== */
  .music-box {
    position: relative;
    z-index: 10;
    width: 100%;
    background-color: rgba(18, 16, 15, 0.42);
    background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0));
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    padding: 14px 16px;
    margin: 0 0 22px;
    box-shadow: 0 14px 28px -18px rgba(74, 51, 54, 0.45);
    backdrop-filter: blur(14px) saturate(1.15);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
  }
  .music-box::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 15% 0%, rgba(29,185,84,0.12), transparent 55%);
    pointer-events:none; border-radius: 14px;
  }
  .music-box.is-playing{
    box-shadow: 0 14px 28px -18px rgba(74,51,54,0.5), 0 0 0 1px rgba(29,185,84,0.32);
  }

  .music-topline{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:12px;
  }

  .disc-player{
    position:relative;
    width:48px; height:48px;
    border-radius:6px;
    background: rgba(255,255,255,0.10);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; padding:0; flex-shrink:0; overflow:hidden; z-index:1;
  }
  .disc-player .disc-label{
    display:block; width:100%; height:100%;
    background: linear-gradient(135deg, var(--raspberry), var(--mustard));
    background-size: cover; background-position: center;
  }

  .music-info{ flex:1; min-width:0; position:relative; z-index:1; }
  .music-title{
    margin:0; font-family:'DM Sans', sans-serif; font-weight:700;
    font-size:13.5px; color:#fff8ee; line-height: 1.4;
    white-space: normal; word-break: break-word;
  }
  .music-sub{
    margin:3px 0 0; font-family:'DM Sans', sans-serif; font-size:11.5px;
    color: rgba(255,248,238,0.62);
  }

  .music-bars {
    display: flex;
    align-items: flex-end; 
    justify-content: center;
    gap: 2px;
    height: 18px;
    padding: 0 2px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 2px;
  }

  .music-bars .bar {
    width: 2px;
    height: 100%;
    background-color: #1db954;
    transform-origin: bottom center !important; 
    transform: scaleY(0.08); 
    transition: transform 0.06s ease;
    will-change: transform;
  }

  .music-playbtn{
    position:relative; z-index:1;
    width:34px; height:34px; flex-shrink:0;
    border-radius:50%; background: rgba(255,248,238,0.92); border:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .music-playbtn:hover{ transform: scale(1.06); background:#ffffff; }
  .music-playbtn svg{ width:14px; height:14px; display:block; }
  .music-playbtn .icon-pause{ display:none; }
  .music-box.is-playing .music-playbtn .icon-play{ display:none; }
  .music-box.is-playing .music-playbtn .icon-pause{ display:block; }

  .music-menu-btn{
    position:relative; z-index:1;
    width:28px; height:28px; flex-shrink:0; border-radius:50%;
    background: transparent; border:none; color: rgba(255,248,238,0.62);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .music-menu-btn:hover{ color:#fff8ee; background: rgba(255,255,255,0.10); }
  .music-menu-btn svg{ width:16px; height:16px; }
  .music-menu-btn[aria-expanded="true"]{ color:#1DB954; background: rgba(29,185,84,0.14); }

  .music-progress-wrap {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 12px;
  }
  .time-label {
    font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: #a7a7a7; min-width: 30px; text-align: center;
  }
  .progress-bar-container {
    flex: 1; height: 4px; background: rgba(255,248,238,0.22); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden;
  }
  .progress-bar-fill { width: 0%; height: 100%; background: #fff8ee; border-radius: 2px; }

  .music-nav{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center; gap:18px; margin-top:10px;
    height: 32px;
  }
  .music-nav button{
    width:28px; height:28px; border:none; border-radius:50%;
    background: transparent; color: rgba(255,248,238,0.62);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .music-nav button svg{ width:16px; height:16px; fill: currentColor; }
  .music-nav button:hover{ color:#fff8ee; transform: scale(1.1); }

  .volume-container {
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%); display: flex; align-items: center; gap: 6px;
    padding: 2px 4px; border-radius: 20px; transition: background 0.2s ease;
  }
  .volume-container:hover { background: rgba(255, 255, 255, 0.08); }

  #volume-btn {
    background: transparent; border: none; color: rgba(255,248,238,0.62);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; width: 24px; height: 24px; outline: none; transition: color 0.2s ease;
  }
  #volume-btn:hover { color: #ffffff; }

  #volume-slider-container {
    position: relative; width: 0; height: 4px;
    background: rgba(255, 255, 255, 0.2); border-radius: 4px;
    cursor: pointer; opacity: 0; overflow: hidden;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
  }
  .volume-container:hover #volume-slider-container { width: 65px; opacity: 1; overflow: visible; }

  #volume-slider-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 100%;
    background: #1db954; border-radius: 4px; pointer-events: none;
  }

  .track-list-panel {
    position: relative; margin-top: 10px; width: 100%; max-height: 0px; 
    overflow-y: hidden; background: rgba(0, 0, 0, 0.25); border-radius: 10px;
    padding: 0 8px; border: 1px solid transparent; opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .track-list-panel.open {
    opacity: 1; max-height: 175px; overflow-y: auto; padding: 8px;
    border-color: rgba(255, 255, 255, 0.1);
  }
  
  .track-list-panel::-webkit-scrollbar {
    width: 4px;
  }
  .track-list-panel::-webkit-scrollbar-track {
    background: transparent;
  }
  .track-list-panel::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }
  .track-list-panel::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.4);
  }

  .track-list-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; font-family:'DM Sans', sans-serif; font-size:11.5px; font-weight:700;
    color:#fff8ee; user-select: none;
  }
  .track-list-header span::before{ content:"♪ "; color:#1DB954; }
  .track-list-close{
    width:22px; height:22px; border:none; border-radius:50%;
    background:transparent; color: rgba(255,248,238,0.6);
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer;
  }
  .track-list-close:hover{ color:#fff8ee; background: rgba(255,255,255,0.12); }
  .track-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  
  .track-item{
    display:flex; align-items:center; gap:10px; padding:6px 8px;
    border-radius:8px; cursor:pointer; user-select: none; transition: background 0.15s ease;
  }
  .track-item:hover{ background: rgba(255,255,255,0.1); }
  .track-item.active{ background: rgba(29,185,84,0.18); }
  .track-item .t-index{ width:16px; text-align:center; font-family:'DM Sans', sans-serif; font-size:11px; color: rgba(255,248,238,0.4); }
  .track-item.active .t-index{ color:#1DB954; font-weight: bold; }
  .track-item .t-cover{ width:32px; height:32px; border-radius:6px; object-fit:cover; flex-shrink:0; }
  .track-item .t-title{ margin:0; min-width:0; font-family:'DM Sans', sans-serif; font-size:12px; color:#fff8ee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-item.active .t-title{ color:#1DB954; font-weight:700; }

  .mini-bars {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    margin-left: auto;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 1px;
  }
  
  .music-box.is-playing .track-item.active .mini-bars {
    display: flex;
  }

  .mini-bars .m-bar {
    width: 2px;
    height: 100%;
    background-color: #1DB954;
    transform-origin: bottom center !important;
    transform: scaleY(0.1);
    transition: transform 0.06s ease;
  }

  /* ===== PHOTO & CONTENT ===== */
  .photo-wrap{
    position:relative; width: 196px; margin: -78px auto 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-shadow{
    position:absolute; width: 76%; height: 72%; top: 12%;
    border-radius: 6px; background: radial-gradient(circle, rgba(74,51,54,0.22), transparent 75%);
    filter: blur(12px); transform: translateY(18px) rotate(-4deg);
  }
  .photo-frame{
    position:relative; width: 176px; background-color: rgba(255,254,252,0.55);
    background-image: var(--texture); padding: 10px 10px 26px; border-radius: 6px;
    rotate: -4deg; transition: rotate 0.4s ease;
  }
  .photo-frame:hover{ rotate: 0deg; }
  .album-cover{ display:block; width: 156px; height: 156px; object-fit:cover; border-radius: 2px; }

  .eyebrow{
    text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); margin: 0 0 6px;
  }
  .eyebrow::before{ content:"$ whoami"; display:block; color: var(--raspberry); margin-bottom:3px; opacity:0.75; }

  h1{
    text-align:center; font-family:'Fraunces', serif; font-weight: 600;
    font-size: clamp(32px, 8vw, 42px); margin: 0 0 4px; line-height:1.05;
  }
  h1 em{ font-style: italic; font-weight:500; color: var(--raspberry); }

  .location{ text-align:center; font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }
  .location::before{ content:"📍 "; }

  .divider{
    display:flex; align-items:center; justify-content:center; margin: 0 0 24px;
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--line);
  }

  .bio{
    text-align:left; font-size: 14.5px; line-height:1.75; color: var(--ink);
    margin: 0 auto 26px; font-family:'IBM Plex Mono', monospace;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35);
    border-left: 3px solid var(--raspberry); border-radius: 8px; padding: 14px 16px;
  }
  .bio::before{ content:"# about.txt"; display:block; font-size:10px; color: var(--ink-soft); margin-bottom:8px; }

  .now{
    margin-top: 26px; padding: 14px 16px; border-radius: 12px;
    background: rgba(124,148,115,0.14); border: 1px dashed rgba(124,148,115,0.5);
    font-size: 13.5px; color: var(--ink-soft); text-align:left;
  }
  .now::before{ content:"$ cat status.log"; display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; margin-bottom:6px; opacity:0.7; }
  .now strong{ color: var(--sage); font-family:'IBM Plex Mono', monospace; font-weight:500; }

  footer{
    display:flex; align-items:center; gap:10px; text-align:left; margin-top: 22px;
    padding: 12px 18px; background: var(--paper-dim); background-image: var(--texture);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
  }
  .foot-dots{ display:flex; gap:6px; flex-shrink:0; }
  .foot-dots .dot{ width:9px; height:9px; border-radius:50%; }
  .foot-dots .dot.r{ background: var(--raspberry); }
  .foot-dots .dot.y{ background: var(--mustard); }
  .foot-dots .dot.g{ background: var(--sage); }
  .foot-text{ flex:1; min-width:0; }
  .foot-text::before{ content:"// "; opacity:0.75; }
</style>
</head>
